<!-- This is the common header content -->
<div class="topbar">
    <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
    </div>

    <a href="{{ url_for('home') }}" class="logo-container">
        <img src="{{ url_for('static', filename='images/ioc_logo_black.svg') }}" alt="UNESCO-IOC Logo" height="60px">
        <img src="{{ url_for('static', filename='images/logo_simple.png') }}" alt="OBIS Logo" height="60px">
        <img src="{{ url_for('static', filename='images/bioecoocean_logo.png') }}" alt="BioEcoOcean Logo" height="50px">
        <img src="{{ url_for('static', filename='images/GOOS-BioEco-logo-update.png') }}" alt="GOOS-BioEco Logo" height="50px">
    </a>

    <nav class="navbar-menu">
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li class="dropdown">
                <a href="{{ url_for('dataproducer') }}">Metadata</a>
                <ul class="dropdown-menu">
                    <li><a href="{{ url_for('handle_form_submission') }}">New Entry</a></li>
                    <li><a href="{{ url_for('update_entry') }}">Update Entry</a></li>
                    <li><a href="{{ url_for('remove_entry') }}">Remove Entry</a></li>
                </ul>
            </li>
            <li><a href="{{ url_for('data') }}">Data tools</a></li>
            <li><a href="{{ url_for('about') }}">About</a></li>
        </ul>
        {% set gh_login = (session.get('user') or {}).get('login') %}
        {% if gh_login %}
        <a class="nav-user" href="{{ url_for('account') }}" title="Signed in with GitHub: view account">
        {% else %}
        <a class="nav-user" href="{{ url_for('github.login') }}" title="Log in with GitHub">
        {% endif %}
            <svg class="nav-user-gh" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span class="nav-user-name">{{ gh_login if gh_login else 'Log In' }}</span>
        </a>
    </nav>
</div>

<script>
    function toggleMenu() {
        const navMenu = document.querySelector(".navbar-menu");
        const hamburger = document.querySelector(".hamburger");
        const isOpen = navMenu.classList.toggle("show");
        hamburger.setAttribute("aria-expanded", isOpen);
    }
</script>
